<div class="picker">
	<button (click)="toggle()">
		{{ selectedOption ?? activeGroup?.label ?? "Select..." }}
	</button>

	@if (isOpen()) {
		<div class="picker__menu">
			<div class="picker__tabs">
				@for (group of groups; track group.id) {
					<button
						(click)="selectGroup(group.id)"
						[class.active]="group.id === selectedGroupId"
					>
						{{ group.icon }} {{ group.label }}
					</button>
				}
			</div>

			<div class="picker__options">
				@for (option of activeGroup?.options ?? []; track option.id) {
          <div
            class="picker__item"
            [class.selected]="option.id === selectedOption"
            (click)="selectOption(option)"
          >
            {{ option.label }}
          </div>
        }
			</div>
		</div>
	}
</div>
